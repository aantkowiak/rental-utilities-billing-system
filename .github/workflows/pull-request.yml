name: Pull Request CI

on:
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Configure npm
        run: |
          rm -f ~/.npmrc
          npm config delete registry --location=global || true
          npm config set registry https://registry.npmjs.org/
          npm cache clean --force

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Configure npm
        run: |
          rm -f ~/.npmrc
          npm config delete registry --location=global || true
          npm config set registry https://registry.npmjs.org/
          npm cache clean --force

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm run test -- --coverage
        env:
          NODE_ENV: test

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      CI: true
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Configure npm
        run: |
          rm -f ~/.npmrc
          npm config delete registry --location=global || true
          npm config set registry https://registry.npmjs.org/
          npm cache clean --force

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local instance
        run: supabase start

      - name: Wait for Supabase to be ready
        run: |
          echo "Waiting for Supabase to be ready..."
          # Give Supabase time to start all services
          sleep 10
          
          # Check if Supabase is actually running
          if supabase status | grep -q "supabase local development setup is running"; then
            echo "✅ Supabase is running"
          else
            echo "❌ Supabase failed to start"
            exit 1
          fi
          
          # Wait for API to be responsive
          for i in {1..30}; do
            if curl -f http://127.0.0.1:54321 > /dev/null 2>&1; then
              echo "✅ Supabase API is responsive after $i attempts"
              break
            fi
            echo "Attempt $i: Waiting for API..."
            sleep 2
          done

      - name: Verify Supabase is running
        run: supabase status

      - name: Build application
        run: |
          echo "🏗️  Starting build process..."
          echo "Build environment:"
          echo "  SUPABASE_URL: $SUPABASE_URL"
          echo "  SUPABASE_KEY is set: $([ -n "$SUPABASE_KEY" ] && echo 'YES' || echo 'NO')"
          npm run build
          echo "✅ Build completed"

      - name: Prepare preview server environment
        run: |
          chmod +x scripts/preview-with-env.sh
          cat > .env.production << EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_KEY=${SUPABASE_KEY}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          PUBLIC_SUPABASE_URL=${PUBLIC_SUPABASE_URL}
          PUBLIC_SUPABASE_ANON_KEY=${PUBLIC_SUPABASE_ANON_KEY}
          EOF

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Stop Supabase
        if: always()
        run: supabase stop

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('playwright.config.ts') != ''
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  status-comment:
    name: Post Status Comment
    runs-on: ubuntu-latest
    needs: [lint, unit-test, e2e-test]
    if: always()
    permissions:
      pull-requests: write

    steps:
      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: unit-test-coverage
          path: coverage/

      - name: Prepare status message
        id: status
        run: |
          LINT_STATUS="${{ needs.lint.result }}"
          UNIT_STATUS="${{ needs.unit-test.result }}"
          E2E_STATUS="${{ needs.e2e-test.result }}"
          
          if [ "$LINT_STATUS" = "success" ] && [ "$UNIT_STATUS" = "success" ] && [ "$E2E_STATUS" = "success" ]; then
            OVERALL="✅ All checks passed!"
            EMOJI="🎉"
          else
            OVERALL="❌ Some checks failed"
            EMOJI="⚠️"
          fi
          
          LINT_ICON="❌"
          [ "$LINT_STATUS" = "success" ] && LINT_ICON="✅"
          
          UNIT_ICON="❌"
          [ "$UNIT_STATUS" = "success" ] && UNIT_ICON="✅"
          
          E2E_ICON="❌"
          [ "$E2E_STATUS" = "success" ] && E2E_ICON="✅"
          [ "$E2E_STATUS" = "skipped" ] && E2E_ICON="⏭️"
          
          cat << EOF > comment.txt
          ## $EMOJI Pull Request CI Status
          
          $OVERALL
          
          ### Check Results
          
          | Check | Status | Result |
          |-------|--------|--------|
          | Lint | $LINT_ICON | \`$LINT_STATUS\` |
          | Unit Tests | $UNIT_ICON | \`$UNIT_STATUS\` |
          | E2E Tests | $E2E_ICON | \`$E2E_STATUS\` |
          
          ---
          *Workflow run: [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*
          EOF

      - name: Post comment to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('comment.txt', 'utf8');
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Pull Request CI Status')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

