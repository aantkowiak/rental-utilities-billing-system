name: Tests

on:
  push:
    branches: [main, develop, actions-test]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: unit-coverage
          fail_ci_if_error: false

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local instance
        run: supabase start

      - name: Wait for Supabase to be ready
        run: |
          echo "Waiting for Supabase to be ready..."
          for i in {1..30}; do
            if curl -f http://127.0.0.1:54321/health > /dev/null 2>&1; then
              echo "✅ Supabase is healthy after $i attempts"
              break
            fi
            echo "Attempt $i: Supabase not ready yet..."
            sleep 2
          done
          sleep 3

      - name: Verify Supabase is running
        run: |
          supabase status
          echo ""
          echo "Docker containers:"
          docker ps | grep supabase
          echo ""
          echo "Docker networks:"
          docker network ls
          echo ""
          echo "Checking if Supabase is accessible from host:"
          curl -s http://127.0.0.1:54321/health && echo "✅ Accessible via 127.0.0.1" || echo "❌ Not accessible via 127.0.0.1"
          curl -s http://localhost:54321/health && echo "✅ Accessible via localhost" || echo "❌ Not accessible via localhost"

      - name: Test Supabase connection
        run: |
          echo "Testing Supabase connectivity..."
          curl -f http://127.0.0.1:54321/health || (echo "Supabase health check failed" && exit 1)
          echo "✅ Supabase is accessible"
          
          echo ""
          echo "Testing actual auth login..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://127.0.0.1:54321/auth/v1/token?grant_type=password \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"tenant1@example.com","password":"password123"}')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY" | head -5
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Direct auth test successful"
          else
            echo "⚠️  Auth returned status $HTTP_CODE"
          fi

      - name: Verify environment variables before build
        run: |
          echo "================================================"
          echo "Environment Variables Check (Before Build)"
          echo "================================================"
          echo "SUPABASE_URL: $SUPABASE_URL"
          echo "SUPABASE_KEY length: ${#SUPABASE_KEY}"
          echo "SUPABASE_KEY (first 20 chars): ${SUPABASE_KEY:0:20}..."
          echo "SUPABASE_SERVICE_ROLE_KEY length: ${#SUPABASE_SERVICE_ROLE_KEY}"
          echo "PUBLIC_SUPABASE_URL: $PUBLIC_SUPABASE_URL"
          echo "PUBLIC_SUPABASE_ANON_KEY length: ${#PUBLIC_SUPABASE_ANON_KEY}"
          echo "PUBLIC_SUPABASE_ANON_KEY (first 20 chars): ${PUBLIC_SUPABASE_ANON_KEY:0:20}..."
          echo "================================================"

      - name: Build application
        run: |
          echo "🏗️  Starting build process..."
          echo "Build environment:"
          echo "  SUPABASE_URL: $SUPABASE_URL"
          echo "  SUPABASE_KEY is set: $([ -n "$SUPABASE_KEY" ] && echo 'YES' || echo 'NO')"
          echo "  PUBLIC_SUPABASE_URL: $PUBLIC_SUPABASE_URL"
          echo "  PUBLIC_SUPABASE_ANON_KEY is set: $([ -n "$PUBLIC_SUPABASE_ANON_KEY" ] && echo 'YES' || echo 'NO')"
          echo ""
          npm run build
          echo ""
          echo "✅ Build completed"
        env:
          # Explicitly pass env vars to build step
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_KEY: ${{ env.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_SUPABASE_URL: ${{ env.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ env.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Inspect built files
        run: |
          echo "================================================"
          echo "Inspecting Built Application"
          echo "================================================"
          echo "Directory structure:"
          ls -la dist/
          echo ""
          echo "Server directory:"
          ls -la dist/server/
          echo ""
          echo "Checking if supabase config is in built code:"
          if grep -r "127.0.0.1:54321" dist/server/ 2>/dev/null; then
            echo "✅ Found hardcoded Supabase URL in built files"
          else
            echo "⚠️  No hardcoded Supabase URL found (might use runtime env vars)"
          fi
          echo ""
          echo "Checking for localhost references:"
          if grep -r "http://localhost" dist/server/ 2>/dev/null | head -5; then
            echo "⚠️  Found localhost references"
          else
            echo "✅ No localhost references found"
          fi
          echo "================================================"

      - name: Final connectivity check before tests
        run: |
          echo "Verifying Supabase is still accessible..."
          curl -v http://127.0.0.1:54321/health 2>&1 | head -20
          echo ""
          echo "Testing auth endpoint..."
          curl -v http://127.0.0.1:54321/auth/v1/health 2>&1 | head -20

      - name: Prepare preview server environment
        run: |
          # Make preview wrapper script executable
          chmod +x scripts/preview-with-env.sh
          
          # Create runtime .env file as backup
          cat > .env.production << EOF
          SUPABASE_URL=${{ env.SUPABASE_URL }}
          SUPABASE_KEY=${{ env.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_SUPABASE_URL=${{ env.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY=${{ env.PUBLIC_SUPABASE_ANON_KEY }}
          EOF
          echo "✅ Created .env.production file"
          echo "✅ Made preview script executable"

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # Ensure env vars are available to the test process and preview server
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_KEY: ${{ env.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_SUPABASE_URL: ${{ env.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ env.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Stop Supabase
        if: always()
        run: supabase stop

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

